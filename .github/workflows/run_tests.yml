name: run_tests
on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    strategy:
      matrix:
        emacs_version:
          - 27.1
          - 27.2
          - 28.1
          - 28.2
          - 29.1
          - 29.2
          - 29.3
          - 29.4
          - snapshot
    steps:
      - uses: actions/checkout@v3
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - name: run-tests
        run: |
          # Use native ERT testing instead of elisp-test framework to avoid compatibility issues
          # Run all tests and capture results.
          # NOTE: process substitution (not pipe) so test_results survives the loop.
          test_results=0
          while read -r test_file; do
            echo "Testing: $test_file"
            if ! emacs -Q --batch \
              --eval "(add-to-list 'load-path \".\")" \
              --eval "(add-to-list 'load-path \"./src\")" \
              --eval "(add-to-list 'load-path \"./src/etm-core\")" \
              --eval "(add-to-list 'load-path \"./src/etm-buffer\")" \
              --eval "(add-to-list 'load-path \"./src/etm-close\")" \
              --eval "(add-to-list 'load-path \"./src/etm-email\")" \
              --eval "(add-to-list 'load-path \"./src/etm-groups\")" \
              --eval "(add-to-list 'load-path \"./src/etm-keys\")" \
              --eval "(add-to-list 'load-path \"./src/etm-layout\")" \
              --eval "(add-to-list 'load-path \"./src/etm-remote\")" \
              --eval "(add-to-list 'load-path \"./src/etm-tabs\")" \
              --eval "(add-to-list 'load-path \"$(dirname "$test_file")\")" \
              --eval "(add-to-list 'load-path \"./tests/mocks\")" \
              --eval "(require 'ert)" \
              --eval "(load-file \"$test_file\")" \
              --eval "(ert-run-tests-batch-and-exit)"; then
              echo "FAILED: $test_file"
              test_results=1
            fi
          done < <(find tests -name "test-*.el" -type f -not -path '*/saved-layouts/*')
          exit $test_results

# EOF